<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Varsha Cushions</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card">

    <img
        src="images/logo.png"
        class="profile"
    >

    <h1>Varsha Cushions</h1>

    <p class="subtitle">
        Premium Car Interior Solutions

    <div class="divider"></div>

    <a class="btn"
       href="https://wa.me/919766222351?text=Hi%20I%20am%20your%20new%20customer"
       target="_blank"
       rel="noopener noreferrer">

        <img src="images/whatsapp.png">

        WhatsApp Me
        
    </a>

    <a class="btn"
       href="http://localhost:3000"
       target="_blank"
       rel="noopener noreferrer">

        <div class="service-grid">

            <div class="service-box">

            <div class="service-box">

                <img src="images/curtain.png">

            </div>

            <div class="service-box">

                <img src="images/floor.png">

                <p>Floor Lamination</p>

            </div>

            <div class="service-box">

                <img src="images/steering.png">

                <p>Steering Cover</p>

            </div>

        </div>

    </div>

    <div class="address-section">


        <img
            src="images/location.png"
            class="address-icon"
        >

        <p class="address">

            Akarnagri, Shop No. 4<br>
            Shukravar Peth<br>
            Near Koteshwar Chowk<br>
            Satara

    <p class="footer">

        • Quality • Comfort • Style
